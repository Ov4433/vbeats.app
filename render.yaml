# VBeats API — free Render blueprint.
#
# Database options (pick one):
#   A. Render Postgres (easiest — same dashboard; free tier expires, check
#      your Render billing page for the current free-DB duration).
#   B. Neon Postgres (neon.tech — free tier, no expiry).
# Either way, paste the connection string as DATABASE_URL when Render
# prompts for it during Blueprint deploy. Never commit the real value.
#
# Deploy: in the Render dashboard choose New > Blueprint and select the
# Ov4433/vbeats.app repo. Fill in DATABASE_URL; JWT_SECRET is
# auto-generated. Everything else can stay blank until you go live with
# Stripe / on-chain verification.

services:
  - type: web
    name: vbeats-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste your Neon connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL_DAYS
        value: 30
      - key: CORS_ORIGINS
        value: https://ov4433.github.io # frontend origin (GitHub Pages)
      - key: MAX_UPLOAD_MB
        value: 50
      - key: STRIPE_SECRET_KEY
        sync: false # leave blank until you wire up real payments
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RPC_URL
        sync: false # leave blank until you wire up on-chain verification
      - key: BEAT_REGISTRY_ADDRESS
        sync: false
      # Durable audio storage (Cloudflare R2). Set all five in the dashboard;
      # until then uploads fall back to the ephemeral local disk.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
