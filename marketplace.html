<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace — Verified Beats Studio</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav" id="nav"></nav>
<main class="wrap">
  <div class="page-head">
    <div><h1>Marketplace</h1><p>Every beat fingerprinted &amp; verifiable on-chain.</p></div>
  </div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search beats…">
    <select id="genre">
      <option value="">All genres</option>
      <option>Trap</option><option>Hip-Hop</option><option>R&amp;B</option>
      <option>Pop</option><option>Drill</option><option>Afrobeats</option><option>EDM</option>
    </select>
    <select id="bpm" title="Tempo">
      <option value="">Any BPM</option>
      <option value="slow">Slow (&lt; 100)</option>
      <option value="mid">Mid (100–139)</option>
      <option value="fast">Fast (140+)</option>
    </select>
    <input type="number" id="min-price" placeholder="Min ETH" min="0" step="0.001" style="width:110px">
    <input type="number" id="max-price" placeholder="Max ETH" min="0" step="0.001" style="width:110px">
    <button class="btn small" id="go">Search</button>
  </div>
  <div id="err"></div>
  <div class="mascot-says">
    <img src="assets/mascot-profile.webp" alt="">
    <div class="bubble">🦇 Fresh drops, all fingerprinted. <b>Nothing fake gets past me.</b> Hit play on anything.</div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note" id="more-wrap" style="text-align:center;margin:24px 0;display:none">
    <button class="btn ghost" id="more">Load more</button>
  </p>
</main>
<footer class="footer"><div class="footer-bat"><img src="assets/mascot-profile.webp" alt=""></div>Verified Beats Studio — Volt keeps the receipts.</footer>
<script src="js/api.js"></script>
<script src="js/flow.js"></script>
<script src="js/volt.js"></script>
<script>
nav('marketplace.html');
let page = 1, lastParams = {};
const grid = document.getElementById('grid');

function card(b) {
  // Unified card (same as the feed): play + Buy license, vote visible,
  // the rest behind the … menu. Price in ETH first.
  return Flow.beatCard(b);
}

function bpmOk(b) {
  const band = document.getElementById('bpm').value;
  if (!band || !b.bpm) return true;
  if (band === 'slow') return b.bpm < 100;
  if (band === 'mid') return b.bpm >= 100 && b.bpm < 140;
  return b.bpm >= 140;
}

async function load(append) {
  try {
    if (!append) grid.innerHTML = Flow.skeletonHtml(6);
    const d = await Flow.fetchWithRetry(() => api.marketplace({ ...lastParams, page, limit: 12 }), 3);
    const beats = (d.beats || []).filter(bpmOk);
    if (!append) grid.innerHTML = '';
    grid.insertAdjacentHTML('beforeend', beats.map(card).join(''));
    Flow.wireCardMenus(grid);
    Flow.refreshUsd(grid);
    Flow.verifyCards(grid); // lazy on-chain proof as cards scroll into view
    document.getElementById('more-wrap').style.display = (d.beats || []).length === 12 ? '' : 'none';
    if (!append && !beats.length) grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px">
      <img src="assets/mascot-profile.webp" alt="" style="width:120px;border-radius:50%;margin-bottom:12px">
      <p class="note">No beats found — try another search.</p>
      <p style="margin-top:14px"><a class="btn" href="studio.html">Make one in the studio</a></p></div>`;
  } catch (e) { grid.innerHTML = Flow.coldStartHtml(); Volt.help("The marketplace is waking up (free tier naps). Give it a few seconds and search again."); }
}

grid.addEventListener('click', e => {
  const playBtn = e.target.closest('[data-play-id]');
  if (playBtn) {
    Flow.play(playBtn.getAttribute('data-play-url'), playBtn.getAttribute('data-play-title'), playBtn);
    return;
  }
  const voteBtn = e.target.closest('[data-vote-id]');
  if (voteBtn) {
    if (!api.loggedIn()) { Flow.signInModal('vote'); return; }
    voteBtn.disabled = true;
    api.vote(voteBtn.getAttribute('data-vote-id')).then(r => {
      const c = voteBtn.querySelector('.vote-count');
      if (c) c.textContent = r.totalWeight;
      voteBtn.classList.toggle('voted', !!r.voted);
    }).catch(err => alert(err.message || err)).finally(() => { voteBtn.disabled = false; });
  }
});

function search() {
  page = 1; grid.innerHTML = '';
  lastParams = {
    search: document.getElementById('q').value.trim(),
    genre: document.getElementById('genre').value,
    minPrice: document.getElementById('min-price').value,
    maxPrice: document.getElementById('max-price').value,
  };
  load(false);
}
document.getElementById('go').onclick = search;
document.getElementById('q').onkeydown = e => { if (e.key === 'Enter') search(); };
document.getElementById('more').onclick = () => { page++; load(true); };
load(false);
</script>
</body>
</html>
