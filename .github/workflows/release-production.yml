name: Release Production

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  eas-production-build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate release readiness
        run: npm run release:readiness
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger production build
        run: eas build --platform all --profile production --non-interactive --no-wait
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

      - name: Capture build queue snapshot
        run: eas build:list --limit 5 --json > eas-builds.json
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

      - name: Upload build snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: eas-builds
          path: eas-builds.json
