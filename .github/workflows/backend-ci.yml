name: backend-ci

on:
  push:
    branches: [scaffold/hardhat-node-express, main]
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    name: backend (typecheck + prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # prisma validate/generate only parse the schema, they never connect,
      # but the datasource url = env("DATABASE_URL") must exist to parse.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vbeats_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build

  contracts:
    name: contracts (compile + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      # compile before typecheck: tests import from typechain-types/,
      # which only exists after hardhat generates it
      - run: npx hardhat compile
      - run: npm run typecheck
      - run: npx hardhat test
