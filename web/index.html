<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Beats Studio — Feed</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav" id="nav"></nav>

<main class="wrap">
  <!-- Stories row: quick moves, app-style -->
  <div class="stories">
    <a class="story rec" href="studio.html">
      <span class="ring"><span class="glyph">⏺</span></span><span>You · Record</span>
    </a>
    <a class="story" href="upload.html">
      <span class="ring"><img src="assets/mascot-profile.webp" alt=""></span><span>Upload</span>
    </a>
    <a class="story" href="claim.html">
      <span class="ring"><span class="glyph">🎟️</span></span><span>Volt Pass</span>
    </a>
    <a class="story" href="marketplace.html">
      <span class="ring"><span class="glyph">🧭</span></span><span>Explore</span>
    </a>
    <a class="story" href="cards.html">
      <span class="ring"><span class="glyph">🃏</span></span><span>Cards</span>
    </a>
    <a class="story" href="chat.html">
      <span class="ring"><span class="glyph">💬</span></span><span>The Booth</span>
    </a>
  </div>

  <div class="hero-mascot" style="margin:6px 0 4px">
    <div class="bubble">🦇 <b>Welcome to the studio.</b> <span style="color:var(--mut);font-size:14px">Every beat in this feed is fingerprinted &amp; verified on-chain. Volt keeps the receipts.</span></div>
  </div>

  <div class="feed">
    <div class="feed-toggle">
      <button id="tg-following" class="on" onclick="setFeed('following')">Following</button>
      <button id="tg-trending" onclick="setFeed('trending')">Trending</button>
    </div>
    <div id="feed"><p class="note" style="text-align:center;padding:24px">Loading the feed…</p></div>
  </div>
</main>

<footer class="footer"><div class="footer-bat"><img src="assets/mascot-profile.webp" alt=""></div>Verified Beats Studio — Volt keeps the receipts.</footer>

<script src="js/api.js"></script>
<script src="js/volt.js"></script>
<script>
nav('index.html');

let allBeats = [];
let feedMode = 'following';
let currentAudio = null;
let playStartedAt = 0;
let playingId = '';

api.marketplace({ limit: 12 }).then(d => {
  allBeats = d.beats || [];
  renderFeed();
}).catch(() => {
  document.getElementById('feed').innerHTML = '<p class="note" style="text-align:center;padding:24px">Marketplace is waking up (free tier cold start) — refresh in a few seconds.</p>';
});

function setFeed(mode) {
  feedMode = mode;
  document.getElementById('tg-following').classList.toggle('on', mode === 'following');
  document.getElementById('tg-trending').classList.toggle('on', mode === 'trending');
  renderFeed();
}

function renderFeed() {
  const box = document.getElementById('feed');
  if (!allBeats.length) {
    box.innerHTML = `<div style="text-align:center;padding:28px 16px">
      <img src="assets/mascot-profile.webp" alt="" style="width:110px;border-radius:50%;margin-bottom:10px">
      <p class="note">No beats yet — be the first to drop one.</p>
      <p style="margin-top:14px"><a class="btn" href="studio.html">⏺ Open the studio</a></p></div>`;
    return;
  }
  const beats = feedMode === 'trending'
    ? [...allBeats].sort((a, b) => (Number(b.price) || 0) - (Number(a.price) || 0))
    : allBeats;
  box.innerHTML = beats.map(post).join('');
}

function post(b) {
  const art = esc(api.artUrl(b));
  return `<article class="post">
    <div class="post-head">
      <img src="${art}" alt="">
      <div>
        <div class="who">${esc(b.title)}</div>
        <div class="sub">${esc(b.genre)}${b.bpm ? ' · ' + esc(b.bpm) + ' BPM' : ''}${b.duration || b.dur ? ' · ' + fmtDur(b.duration || b.dur) : ''}</div>
      </div>
      <span class="chip">✓ VERIFIED ON-CHAIN</span>
    </div>
    <img class="post-art" src="${art}" alt="" loading="lazy">
    <div class="post-body">
      <div class="post-actions">
        <button class="play-btn" data-id="${esc(b.id)}" onclick="togglePlay(this,'${esc(b.id)}','${esc(api.mediaUrl(b))}')">▶</button>
        <span class="price">$${esc(b.price)}</span>
        <a class="btn small" href="beat.html?id=${esc(b.id)}">Lease / Mint</a>
        <a class="btn small ghost" href="beat.html?id=${esc(b.id)}">Make offer</a>
        <a class="btn small ghost" href="studio.html">Remix</a>
      </div>
    </div>
  </article>`;
}

function stopCurrent(btn) {
  if (!currentAudio) return;
  const listened = Math.round((Date.now() - playStartedAt) / 1000);
  if (playingId && listened > 1) api.play(playingId, listened);
  currentAudio.pause();
  currentAudio = null; playingId = '';
  document.querySelectorAll('.play-btn.playing').forEach(x => { x.classList.remove('playing'); x.textContent = '▶'; });
}

function togglePlay(btn, id, url) {
  if (!url) return;
  if (currentAudio && playingId === id && !currentAudio.paused) { stopCurrent(btn); return; }
  stopCurrent(btn);
  currentAudio = new Audio(url); playingId = id; playStartedAt = Date.now();
  currentAudio.play(); btn.classList.add('playing'); btn.textContent = '⏸';
  currentAudio.onended = () => stopCurrent(btn);
}
</script>
</body>
</html>
