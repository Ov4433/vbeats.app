<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat — Verified Beats Studio</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav" id="nav"></nav>
<main class="wrap" style="max-width:720px">
  <div id="err"></div>
  <div id="beat"></div>
</main>
<footer class="footer"><div class="footer-bat"><img src="assets/mascot-profile.webp" alt=""></div>Verified Beats Studio — Volt keeps the receipts.</footer>
<script src="js/api.js"></script>
<script src="js/flow.js"></script>
<script src="js/volt.js"></script>
<script>
nav('');
const id = new URLSearchParams(location.search).get('id');
let currentBeat = null;
let currentOffers = [];
let directBuyReady = false;

async function toggleVote(btn, beatId) {
  // Sign-in modal returns you here — the old confirm() sent you away
  // to upload.html.
  if (!api.loggedIn()) { Flow.signInModal('vote'); return; }
  try {
    btn.disabled = true;
    const r = await api.vote(beatId);
    const count = btn.querySelector('.vote-count');
    if (count) count.textContent = r.totalWeight;
    btn.classList.toggle('voted', !!r.voted);
  } catch (e) { alert(e.message || e); }
  finally { btn.disabled = false; }
}

async function toggleVote(btn, beatId) {
  if (!api.loggedIn()) {
    if (confirm('Sign in to vote — head to the sign-in page?')) location.href = 'upload.html';
    return;
  }
  try {
    btn.disabled = true;
    const r = await api.vote(beatId);
    const count = btn.querySelector('.vote-count');
    if (count) count.textContent = r.totalWeight;
    btn.classList.toggle('voted', !!r.voted);
  } catch (e) { alert(e.message || e); }
  finally { btn.disabled = false; }
}

async function load() {
  if (!id) { showErr('err', 'No beat id given.'); return; }
  try {
    const b = await api.beat(id);
    currentBeat = b;
    const v = await api.verify(id).catch(() => null);
    // verify returns a flat shape: { verified, fingerprint, onChain, chainConfigured, chainOwner? }
    const chain = v ? { onChain: v.onChain, configured: v.chainConfigured, owner: v.chainOwner } : null;
    document.getElementById('beat').innerHTML = `
      <div class="page-head"><div><h1>${esc(b.title)}${b.isHouse ? ' <span class="house-tag">🏠 House beat</span>' : ''}</h1>
        <p>${esc(b.genre)}${b.bpm ? ' · ' + esc(b.bpm) + ' BPM' : ''}${b.duration || b.dur ? ' · ' + fmtDur(b.duration || b.dur) : ''}</p>
        <p class="note" style="margin-top:4px">by <a id="producer-link" href="creator.html?u=${esc(b.userId)}" style="color:var(--pur)">this producer</a></p></div></div>
      <img src="${esc(api.artUrl(b))}" alt="" style="width:100%;border-radius:16px;border:1px solid var(--line)">
      <audio class="wide" id="player" controls src="${esc(api.mediaUrl(b))}"></audio>
      ${b.kind === 'song' ? `<div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">🎤 Song · over <a href="beat.html?id=${esc(b.parentBeatId || (b.parentBeat && b.parentBeat.id) || '')}" style="color:var(--pur)">${esc((b.parentBeat && b.parentBeat.title) || 'the parent beat')}</a></h3>
        <p class="note">Vocals by this song's maker, over the producer's beat. The backing track stays licensed on the parent beat's page — this song is the vocal take, linked to it.</p>
        ${b.coSignStatus === 'pending' ? '<p class="note" style="margin-top:8px"><span class="badge wait">Awaiting producer co-sign</span> — saved, but not in the public feed until the parent beat\'s producer approves it.</p>' : ''}
        ${b.coSignStatus === 'rejected' ? '<p class="note" style="margin-top:8px"><span class="badge no">Not co-signed</span> — the parent beat\'s producer declined this song.</p>' : ''}
        ${b.coSignStatus === 'live' && b.coSignedBy ? '<p class="note" style="margin-top:8px"><span class="badge ok">✓ Co-signed by ' + esc(b.coSignedBy.username) + '</span> — the parent beat\'s producer featured this song.</p>' : ''}
        <p style="margin-top:10px"><button class="btn ghost small" id="share-song-btn">Share this song</button> <span class="note" id="share-note"></span></p></div>
      <div id="feature-card"></div>` : ''}
      ${b.kind !== 'song' ? `<div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">🎤 Make a song</h3>
        <p class="note">Rap over this beat, Rapchat-style — pick it, record your vocals while it loops, publish a fingerprinted song linked to this beat. Your vocal take is yours; the beat's license stays here.</p>
        <p style="margin-top:10px"><a class="btn" href="make.html?beat=${esc(b.id)}">🎤 Rap on this beat</a></p></div>` : ''}
      ${b.description || b.desc ? `<div class="card" style="margin-top:16px"><p>${esc(b.description || b.desc)}</p></div>` : ''}
      <div class="card" style="margin-top:16px" id="buy-panel">
        <h3 style="margin-bottom:10px">🎟️ Buy license</h3>
        <div data-price-eth="${esc(Number(b.price) || 0)}" style="font-size:24px">${Flow.priceHtml(b)}</div>
        <p class="note" style="margin-top:8px"><b>What you get:</b> a lease lets you use the beat in your track. A 1-of-1 exclusive means no more leases are sold. ERC-1155 &middot; 10% producer royalty on secondary sales.</p>
        <div id="buy-direct" style="margin-top:12px"><span class="badge wait">Checking instant-buy availability…</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">
          <button class="btn buy-go-btn" id="buy-now-btn">Buy license — via offer</button>
          <button class="btn ghost vote-btn${b.votedByMe ? ' voted' : ''}" id="vote-btn" data-vote-id="${esc(b.id || id)}" onclick="toggleVote(this,'${esc(b.id || id)}')" aria-label="Vote for this beat">▲ <span class="vote-count">${esc(b.votes?.totalWeight ?? 0)}</span></button>
          <button class="btn ghost" id="share-btn">Share</button><span class="note" id="share-note"></span>
        </div>
      </div>
      <div id="list-panel"></div>
      <div class="card" style="margin-top:16px">
        <h3 style="margin-bottom:10px">🔒 Provenance</h3>
        <p class="mono">${esc(b.fingerprint || 'no fingerprint recorded')}</p>
        <p style="margin-top:10px" id="chainline">${chainBadge(chain)}</p>
      </div>
        <h3 style="margin-bottom:10px">🎟️ NFT licenses</h3>
        <p id="nftline"><span class="badge wait">Checking…</span></p>
      </div>
      <div class="card" style="margin-top:16px">
        <h3 style="margin-bottom:10px">🤝 Offers</h3>
        <div id="offers"><span class="badge wait">Checking…</span></div>
        <div id="make-offer" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
          <h4 style="margin-bottom:8px">Make an offer</h4>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
            <label class="note">Leases<br><input id="off-amount" type="number" value="1" min="1" style="width:70px"></label>
            <label class="note">ETH<br><input id="off-eth" type="number" step="0.01" min="0" placeholder="0.5" style="width:90px"></label>
            <label class="note">Days<br><input id="off-days" type="number" value="7" min="1" max="90" style="width:60px"></label>
            <label class="note"><input id="off-exclusive" type="checkbox"> 1-of-1 exclusive</label>
            <label class="note"><input id="off-final" type="checkbox"> final (24h)</label>
            <button class="btn small" id="off-submit">Send offer</button>
          </div>
          <p class="note" style="margin-top:6px" id="off-total">ETH is locked in the contract until accepted, rejected, cancelled, or expired. If accepted, the producer is paid the agreed price and any remainder is refunded — no platform fee is taken on offers.</p>
        </div>
        <div id="volt-nudge" style="display:none;margin-top:12px"></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3 style="margin-bottom:10px">📊 Card back</h3>
        <div id="cardback">${cardBack(b.stats)}</div>
      </div>
      <div class="sticky-buy"><span data-price-eth="${esc(Number(b.price) || 0)}">${Flow.priceHtml(b)}</span><button class="btn buy-go-btn">Buy license</button></div>
      <div id="chain-explainer"></div>
      <div class="mascot-says">
        <img src="assets/mascot-profile.webp" alt="">
        <div class="bubble">🦇 The fingerprint doesn't lie. If it's <b>verified</b>, this is the real audio.</div>
      </div>`;
    Flow.refreshUsd(document.getElementById('beat'));
    renderFeatureCard(b);
    renderListCard();
    // Share (money path, Nov 13): real beat/song URL, native sheet or copy.
    const shareNote = document.getElementById('share-note');
    const doShare = async () => {
      try { if (shareNote) shareNote.textContent = await Flow.shareBeat(currentBeat); }
      catch { if (shareNote) shareNote.textContent = 'Share failed — copy the link from the address bar instead.'; }
    };
    const shareBtn = document.getElementById('share-btn');
    if (shareBtn) shareBtn.onclick = doShare;
    const shareSongBtn = document.getElementById('share-song-btn');
    if (shareSongBtn) shareSongBtn.onclick = doShare;
    document.getElementById('chain-explainer').innerHTML = Flow.chainExplainerHtml();
    // Deep links from feed cards (Flow.primaryCta, Grok Nov 13):
    // #buy → buy panel, #offer → offer form (shown by loadOffers when
    // the contracts are configured; otherwise scroll to the Offers card).
    // #list → the producer's List for sale card.
    if (location.hash === '#buy' || location.hash === '#offer' || location.hash === '#list') {
      const target = document.getElementById(location.hash === '#buy' ? 'buy-panel' : location.hash === '#offer' ? 'make-offer' : 'list-panel');
      if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 600);
    }
    document.querySelectorAll('.buy-go-btn').forEach(btn => {
      btn.onclick = () => {
        if (directBuyReady) {
          const panel = document.getElementById('buy-direct');
          if (panel) { panel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
          return;
        }
        const form = document.getElementById('make-offer');
        if (form && window.VBEATS_NFT_ADDRESS && window.VBEATS_OFFERS_ADDRESS) {
          form.style.display = '';
          form.scrollIntoView({ behavior: 'smooth', block: 'center' });
          const eth = document.getElementById('off-eth');
          if (eth) eth.focus();
        } else {
          Volt.help('Offers go live when the contract deploys.');
        }
      };
    });
    // Live fee + total preview on the offer form.
    const offEth = document.getElementById('off-eth');
    const offTotal = document.getElementById('off-total');
    if (offEth && offTotal) {
      offEth.oninput = () => {
        const v = Number(offEth.value);
        offTotal.textContent = (isFinite(v) && v > 0)
          ? 'Total locked: ' + v + ' ETH. If accepted, the producer is paid the agreed price and any remainder is refunded — no platform fee is taken.'
          : 'ETH is locked in the contract until accepted, rejected, cancelled, or expired. If accepted, the producer is paid the agreed price and any remainder is refunded — no platform fee is taken.';
      };
    }
    // Fill in the producer's name from their public creator profile.
    api.publicProfile(b.userId).then(p => {
      const link = document.getElementById('producer-link');
      if (link && p && p.username) {
        link.textContent = p.username;
        link.href = 'creator.html?u=' + encodeURIComponent(p.username);
      }
    }).catch(() => { /* link still works by user id */ });
    // Card-back play tracking: count the play once, report listen time on pause.
    const player = document.getElementById('player');
    if (player) {
      let counted = false;
      player.addEventListener('play', () => {
        if (counted) return;
        counted = true;
        api.play(id, 0);
      });
      const reportTime = () => {
        if (player.currentTime > 1) api.play(id, Math.floor(player.currentTime));
      };
      player.addEventListener('pause', reportTime);
      player.addEventListener('ended', reportTime);
    }
  } catch (e) { showErr('err', e.message); }
}
/* Feature / co-sign request (Nov 13): on a pending song, the singer
   asks the parent beat's producer to feature it; the producer answers
   right here. One pending request per song. A 404 means the old backend
   — the card says so honestly instead of faking a send. */
async function renderFeatureCard(b) {
  const box = document.getElementById('feature-card');
  if (!box || b.kind !== 'song' || b.coSignStatus !== 'pending') return;
  const parentOwner = (b.parentBeat && b.parentBeat.userId) || null;
  if (!api.loggedIn()) {
    box.innerHTML = '<div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">🎤 Request feature</h3><p class="note">Sign in to ask the parent beat’s producer to feature this song.</p></div>';
    return;
  }
  let me = null;
  try { const p = await api.profile(); me = p && p.id; } catch { /* signed-out state */ }
  if (me && me === parentOwner) {
    box.innerHTML = '<div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">🎤 Feature request — your call</h3>' +
      '<p class="note">This song raps over your beat and is waiting on you. Accepting puts it live in the feed; declining keeps it out.</p>' +
      '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn small" id="feat-accept">Accept — feature it</button>' +
      '<button class="btn ghost small" id="feat-decline">Decline</button></div><p class="note" id="feat-note"></p></div>';
    document.getElementById('feat-accept').onclick = async () => {
      try { await api.coSign(b.id, 'approve'); location.reload(); }
      catch (e) { document.getElementById('feat-note').textContent = e.message || String(e); }
    };
    document.getElementById('feat-decline').onclick = async () => {
      try { await api.coSign(b.id, 'reject'); location.reload(); }
      catch (e) { document.getElementById('feat-note').textContent = e.message || String(e); }
    };
    return;
  }
  if (me && me === b.userId) {
    box.innerHTML = '<div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">🎤 Request feature</h3>' +
      '<p class="note">Ask the parent beat’s producer to feature your song — that is what puts it live in the feed. One request at a time.</p>' +
      '<p style="margin-top:10px"><button class="btn small" id="feat-send">Request feature</button></p><p class="note" id="feat-note"></p></div>';
    let alreadySent = false;
    try {
      const sent = await api.featureSent();
      alreadySent = ((sent && sent.requests) || []).some(r => r.songId === b.id && r.status === 'pending');
    } catch (e) {
      if (String(e.message || '').includes('404')) {
        document.getElementById('feat-note').textContent = 'Feature requests need the latest backend — it has not landed yet, so this request cannot be sent right now.';
        document.getElementById('feat-send').disabled = true;
        return;
      }
      /* sent list failed for another reason — still allow the request;
         the backend will refuse a duplicate. */
    }
    if (alreadySent) {
      document.getElementById('feat-note').textContent = 'Request sent — awaiting the producer. You will see it go live here once they accept.';
      document.getElementById('feat-send').disabled = true;
      return;
    }
    document.getElementById('feat-send').onclick = async () => {
      try {
        await api.requestFeature(b.id);
        document.getElementById('feat-note').textContent = 'Request sent — awaiting the producer. You will see it go live here once they accept.';
        document.getElementById('feat-send').disabled = true;
      } catch (e) {
        document.getElementById('feat-note').textContent = String(e.message || '').includes('404')
          ? 'Feature requests need the latest backend — it has not landed yet, so this request cannot be sent right now.'
          : (e.message || String(e));
      }
    };
    return;
  }
  box.innerHTML = '<div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">🎤 Request feature</h3><p class="note">This song is awaiting the parent beat’s producer — only the singer can request the feature, and only the producer can answer it.</p></div>';
}

function cardBack(s) {
  if (!s) return '<span class="badge wait">Stats loading…</span>';
  const rankLine = s.rankBySales <= s.rankedBeats
    ? `#${s.rankBySales} of ${s.totalBeats} by beats sold`
    : `Unranked · ${s.totalBeats} beats in the studio`;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;text-align:center">
      <div><div style="font-size:22px;font-weight:700">${esc(s.rankBySales)}</div><div class="note">Sales rank</div></div>
      <div><div style="font-size:22px;font-weight:700">${esc(s.sales)}</div><div class="note">Beats sold</div></div>
      <div><div style="font-size:22px;font-weight:700">${esc(s.plays)}</div><div class="note">Plays</div></div>
      <div><div style="font-size:22px;font-weight:700">${esc(s.uniqueListeners)}</div><div class="note">Listeners</div></div>
    </div>
    <p class="note" style="margin-top:10px;text-align:center">${esc(rankLine)}</p>`;
}
function chainBadge(c) {
  if (!c) return '<span class="badge wait">On-chain status unknown</span>';
  if (c.configured === false) return '<span class="badge wait">Not on-chain yet — contract not configured</span>';
  if (c.onChain) return `<span class="badge ok">✓ Registered on-chain</span>
    ${c.owner ? `<p class="note">Owner ${Flow.explorerAddr(c.owner)}</p>` : ''}
    ${c.registeredAt ? `<p class="note">Registered ${esc(c.registeredAt)}</p>` : ''}
    <p class="note">Registry <a class="mono" href="https://basescan.org/address/${esc(window.VBEATS_REGISTRY_ADDRESS || '')}" target="_blank" rel="noopener">view contract on Basescan &rarr;</a></p>`;
  return '<span class="badge no">Fingerprint not registered on-chain</span>';
}
/* Producer listing (money path, Nov 13): the "List for sale" form the
   site never had. Only the on-chain producer (wallet == registry owner)
   sees it. It calls the real setPrice / stockForSale on BeatNFT — two
   transactions per license type, price first, then stock — so the beat
   becomes instantly buyable. Until a price AND stock are both set, the
   buy panel keeps saying "via offer". No listing form exists anywhere
   else; this is the one. */
async function renderListCard() {
  const box = document.getElementById('list-panel');
  if (!box || !currentBeat || !currentBeat.fingerprint) return;
  let producer = null;
  try { producer = await api.producerOf(currentBeat.fingerprint); } catch {}
  const me = (api.wallet || '').toLowerCase();
  if (!me) {
    box.innerHTML = '';
    return;
  }
  if (!producer || me !== producer.toLowerCase()) return; // not the producer
  let listing = null, configured = false;
  try { const n = await api.nft(id); configured = !!n.configured; listing = n.listing || {}; } catch {}
  const lease = listing && listing.lease;
  const excl = listing && listing.exclusive;
  const cur = [];
  if (lease) cur.push('Lease ' + lease.priceEth + ' ETH · ' + lease.stock + ' in stock');
  if (excl) cur.push('Exclusive ' + excl.priceEth + ' ETH');
  box.innerHTML = `<div class="card" style="margin-top:16px"><h3 style="margin-bottom:8px">🏷️ List for sale</h3>
    <p class="note">You are the producer. Set a price and stock licenses on the BeatNFT contract and this beat becomes instantly buyable — one tap, on-chain, in ETH.</p>
    <p class="note" style="margin-top:6px">${configured ? (cur.length ? 'Live now: ' + esc(cur.join(' · ')) : 'Not listed yet — no price or stock on-chain.') : 'The NFT contract is not configured, so listing is not available yet.'}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:12px">
      <label class="note">Lease price (ETH)<br><input id="list-lease-eth" type="number" step="0.01" min="0" placeholder="0.005" value="${lease ? esc(lease.priceEth) : ''}" style="width:100px"></label>
      <label class="note">Leases in stock<br><input id="list-lease-stock" type="number" min="1" value="${lease ? esc(lease.stock) : '10'}" style="width:70px"></label>
      <label class="note">Exclusive price (ETH, optional)<br><input id="list-excl-eth" type="number" step="0.01" min="0" placeholder="0.05" value="${excl ? esc(excl.priceEth) : ''}" style="width:100px"></label>
      <button class="btn" id="list-go">List on-chain</button>
    </div>
    <p class="note" style="margin-top:8px">${Flow.feeNoteHtml()} Listing takes two wallet confirmations per license type (set price, then stock).</p>
    <p class="note" id="list-note"></p></div>`;
  const go = document.getElementById('list-go');
  const note = document.getElementById('list-note');
  go.onclick = async () => {
    const leaseEth = document.getElementById('list-lease-eth').value;
    const leaseStock = document.getElementById('list-lease-stock').value;
    const exclEth = document.getElementById('list-excl-eth').value;
    const hasLease = leaseEth && Number(leaseEth) > 0;
    const hasExcl = exclEth && Number(exclEth) > 0;
    if (!hasLease && !hasExcl) { note.textContent = 'Enter a lease price or an exclusive price to list.'; return; }
    const summary = (hasLease ? 'Lease ' + leaseEth + ' ETH × ' + (leaseStock || 1) + ' in stock' : '') +
      (hasLease && hasExcl ? ' · ' : '') + (hasExcl ? 'Exclusive ' + exclEth + ' ETH' : '');
    const ok = await confirmModal('List this beat on-chain for ' + summary + '? ' + Flow.feeNoteHtml());
    if (!ok) return;
    go.disabled = true;
    try {
      const hashes = await api.listBeat(currentBeat.fingerprint, {
        leasePriceEth: hasLease ? leaseEth : null,
        leaseStock: hasLease ? leaseStock : null,
        exclusivePriceEth: hasExcl ? exclEth : null,
      });
      note.textContent = 'Listed — ' + hashes.length + ' transaction' + (hashes.length > 1 ? 's' : '') + ' confirmed. Instant buy is live now.';
      await loadNft();
      renderListCard();
    } catch (e) {
      note.textContent = e.message || String(e);
    } finally { go.disabled = false; }
  };
  if (location.hash === '#list') setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
}
/* Direct buy lives or dies on the live listing: a price > 0 AND stock
   on the BeatNFT contract. loadNft() reads it from the backend (which
   reads the contract) and renders the buy panel honestly:
   - listed → lease/exclusive choice, amount, total preview, "Buy now"
     that calls BeatNFT.buy() with the exact total. The full listed price
     goes to the producer — the contract takes no platform fee.
   - not listed → the button stays "Buy license — via offer" and the panel
     says why instant buy is not available. No fake mint button.
   - chain down → the button becomes "Make offer" and the panel says the
     chain is unreachable; offers still work. */
async function loadNft() {
  const buyEl = document.getElementById('buy-direct');
  const buyBtn = document.getElementById('buy-now-btn');
  try {
    const n = await api.nft(id);
    const el = document.getElementById('nftline');
    if (!el) return;
    if (!n.configured) {
      el.innerHTML = '<span class="badge wait">NFT contract not deployed yet</span>';
      if (buyEl) buyEl.innerHTML = '<p class="note">Instant buy is not available yet — the NFT contract is not deployed. You can still make an offer below.</p>';
      if (buyBtn) buyBtn.textContent = 'Make offer';
      return;
    }
    const royaltyPct = (n.royaltyBps != null ? (n.royaltyBps / 100) : 10);
    el.innerHTML = `<span class="badge ok">✓ Licenses live</span>
      <p class="note" style="margin-top:8px">Contract <a class="mono" href="https://basescan.org/address/${esc(n.contract)}" target="_blank" rel="noopener">${esc(n.contract)} &rarr;</a></p>
      <p class="note">Token ID <span class="mono">${esc(n.tokenId)}</span></p>
      <p class="note">ERC-1155 · lease editions + 1-of-1 exclusive · ${esc(royaltyPct)}% producer royalty on secondary sales</p>`;
    const L = n.listing || {};
    const leaseOk = L.lease && Number(L.lease.priceEth) > 0 && Number(L.lease.stock) >= 1;
    const exclOk = L.exclusive && Number(L.exclusive.priceEth) > 0 && Number(L.exclusive.stock) >= 1;
    if (!buyEl) return;
    if (!leaseOk && !exclOk) {
      buyEl.innerHTML = '<p class="note">Instant buy is not available for this beat yet — the producer has not set a price or stocked licenses. You can still make an offer below, and the producer can accept it.</p>';
      return;
    }
    directBuyReady = true;
    const fmt = (x) => (Number(x) || 0) + ' ETH';
    let typeHtml = '';
    if (leaseOk && exclOk) {
      typeHtml = `<label class="note" style="margin-right:12px"><input type="radio" name="buy-type" value="lease" checked> Lease — ${esc(fmt(L.lease.priceEth))} each${Number(L.lease.stock) > 1 ? ' · ' + esc(L.lease.stock) + ' in stock' : ''}</label>
        <label class="note"><input type="radio" name="buy-type" value="exclusive"> 1-of-1 exclusive — ${esc(fmt(L.exclusive.priceEth))}</label>`;
    } else if (leaseOk) {
      typeHtml = `<p class="note">Lease — <b>${esc(fmt(L.lease.priceEth))}</b> each${Number(L.lease.stock) > 1 ? ' · ' + esc(L.lease.stock) + ' in stock' : ''}</p><input type="hidden" name="buy-type" value="lease">`;
    } else {
      typeHtml = `<p class="note">1-of-1 exclusive — <b>${esc(fmt(L.exclusive.priceEth))}</b></p><input type="hidden" name="buy-type" value="exclusive">`;
    }
    buyEl.innerHTML = `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <span id="buy-types">${typeHtml}</span>
        ${leaseOk ? '<label class="note">Amount<br><input id="buy-amount" type="number" value="1" min="1" max="' + esc(L.lease.stock) + '" style="width:70px"></label>' : ''}
        <button class="btn" id="buy-submit">Buy now</button>
      </div>
      <p class="note" style="margin-top:6px" id="buy-total"></p>
      <p class="note">${Flow.feeNoteHtml()} Your wallet will ask you to confirm the exact total.</p>`;
    const totalEl = document.getElementById('buy-total');
    const submitBtn = document.getElementById('buy-submit');
    const curType = () => {
      const r = buyEl.querySelector('input[name="buy-type"]:checked') || buyEl.querySelector('input[name="buy-type"]');
      return r ? r.value : 'lease';
    };
    const curAmount = () => {
      const a = document.getElementById('buy-amount');
      return curType() === 'exclusive' ? 1 : Math.max(1, Math.floor(Number(a && a.value) || 1));
    };
    const curPrice = () => {
      const t = curType();
      return t === 'exclusive' ? Number(L.exclusive.priceEth) : Number(L.lease.priceEth);
    };
    const refreshTotal = () => {
      const total = curPrice() * curAmount();
      if (totalEl) totalEl.textContent = 'Total: ' + total + ' ETH' + (curAmount() > 1 ? ' (' + curAmount() + ' × ' + curPrice() + ' ETH)' : '') + ' — no fees added.';
      if (submitBtn) submitBtn.textContent = 'Buy now — ' + total + ' ETH';
      if (buyBtn) buyBtn.textContent = 'Buy now — ' + total + ' ETH';
    };
    buyEl.addEventListener('change', refreshTotal);
    buyEl.addEventListener('input', refreshTotal);
    refreshTotal();
    submitBtn.onclick = async () => {
      if (!api.loggedIn()) { Flow.signInModal('buy'); return; }
      const exclusive = curType() === 'exclusive';
      const amount = curAmount();
      const totalEth = curPrice() * amount;
      submitBtn.disabled = true;
      try {
        const hash = await api.buyLicense(currentBeat.fingerprint, exclusive, amount);
        // Record the purchase on the backend (best-effort — the on-chain
        // tx is the proof either way). The receipt card below is shown
        // regardless of whether the record call lands.
        let recorded = null, recordNote = '';
        try { recorded = await api.recordPurchase(currentBeat.id, hash, totalEth, exclusive ? 'exclusive' : 'lease'); }
        catch (e) {
          recordNote = String(e.message || '').includes('404')
            ? 'Receipt could not be saved yet — the earnings backend has not landed, but your on-chain transaction is the proof.'
            : 'Receipt could not be saved: ' + (e.message || e);
        }
        if (buyEl) buyEl.innerHTML = '<p class="note">✅ License bought — ' + Flow.explorerTx(hash) + '.</p>' +
          '<p class="note" style="margin-top:8px"><b>' + (exclusive ? '1-of-1 exclusive' : amount + ' lease' + (amount > 1 ? 's' : '')) + '</b> · ' + totalEth + ' ETH · ' + Flow.feeNoteHtml() + '</p>' +
          '<p style="margin-top:12px"><a class="btn" href="' + esc(api.mediaUrl(currentBeat)) + '" download>⬇ Download your licensed audio</a></p>' +
          '<p class="note" style="margin-top:8px">Re-download free anytime — Profile → My purchases. ' + (recorded ? 'Receipt saved' + (recorded.status === 'pending' ? ' (pending on-chain confirmation)' : '') + '.' : esc(recordNote)) + '</p>' +
          '<p style="margin-top:10px"><a class="btn ghost small" href="profile.html">View my purchases</a> <a class="btn ghost small" href="beat.html?id=' + esc(currentBeat.id) + '">Back to the beat</a></p>';
        directBuyReady = false;
        if (buyBtn) buyBtn.textContent = 'Buy license — via offer';
      } catch (e) {
        alert(e.message || e);
      } finally { submitBtn.disabled = false; }
    };
  } catch {
    // Chain down (or backend down): instant buy is paused, offers still
    // work — the button becomes "Make offer" instead of a dead Buy now.
    if (buyEl) buyEl.innerHTML = '<p class="note">Could not check instant-buy availability — the Base chain or the listing service is unreachable right now. You can still make an offer below, and the producer can accept it.</p>';
    if (buyBtn) buyBtn.textContent = 'Make offer';
  }
}
async function loadOffers() {
  const el = document.getElementById('offers');
  if (!el) return;
  try {
    const d = await api.offers(id);
    if (!d.configured) {
      el.innerHTML = '<span class="badge wait">Offers go live when the contract deploys</span>';
      return;
    }
    const live = d.offers.filter(o => o.active);
    currentOffers = live;
    const me = (api.wallet || '').toLowerCase();
    let producer = null;
    try { producer = await api.producerOf(currentBeat.fingerprint); } catch {}
    const isProducer = me && producer && me === producer.toLowerCase();

    // Make-an-offer form (needs the NFT contract address + a connected wallet).
    const form = document.getElementById('make-offer');
    if (form) {
      if (window.VBEATS_NFT_ADDRESS && window.VBEATS_OFFERS_ADDRESS) {
        form.style.display = '';
        document.getElementById('off-submit').onclick = submitOffer;
      } else {
        form.style.display = 'none';
      }
    }

    if (!live.length) {
      el.innerHTML = '<p class="note">No active offers — be the first to make one.</p>';
    } else {
      el.innerHTML = live.map(o => {
        const mine = me && o.buyer.toLowerCase() === me;
        const btns = [];
        const b = (label, act) => `<button class="btn ghost small" data-act="${act}" data-id="${o.offerId}">${label}</button>`;
        if (mine) {
          btns.push(b('Raise', 'raise'), b('Lower', 'lower'));
          if (!o.isFinal) btns.push(b('Make final', 'final'));
          if (o.askEth) btns.push(b('Accept ask', 'acceptAsk'));
          btns.push(b('Cancel', 'cancel'));
        }
        if (isProducer) {
          btns.push(b('Accept', 'accept'), b('Counter', 'counter'), b('Final counter', 'counterFinal'));
          if (o.askEth) btns.push(b('Withdraw ask', 'withdrawAsk'));
          btns.push(b('Reject', 'reject'));
        }
        return `
        <div style="padding:10px 0;border-top:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
            <span><b>${o.exclusive ? '1-of-1 exclusive' : esc(o.amount) + ' leases'}</b>
              ${o.isFinal ? '<span class="badge no" style="margin-left:6px">FINAL \u00b7 24h</span>' : ''}
              ${mine ? '<span class="badge ok" style="margin-left:6px">yours</span>' : ''}</span>
            <span class="mono">${esc(o.bidEth)} ETH${o.askEth ? ' \u2192 ask ' + esc(o.askEth) + ' ETH' : ''}</span>
          </div>
          <p class="note" style="margin-top:4px">${o.rounds} round${o.rounds === 1 ? '' : 's'} \u00b7 expires ${esc(new Date(o.expiresAt).toLocaleString())}</p>
          ${btns.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${btns.join('')}</div>` : ''}
        </div>`;
      }).join('');
      el.querySelectorAll('[data-act]').forEach(btn => {
        btn.onclick = () => offerAction(btn.dataset.act, btn.dataset.id, btn);
      });
    }

    // Volt's nudge: a stalled negotiation gets a quiet suggestion.
    const stalled = live.find(o => o.stalled);
    const nudge = document.getElementById('volt-nudge');
    if (stalled && nudge) {
      nudge.style.display = '';
      nudge.innerHTML = `
        <div class="mascot-says">
          <img src="assets/mascot-profile.webp" alt="">
          <div class="bubble">\U0001F987 This one's gone quiet \u2014 ${stalled.rounds} rounds, no movement for over a day.
          A <b>final offer</b> (24 hours, take-it-or-leave-it) is usually what closes it.</div>
        </div>`;
    }
  } catch { el.innerHTML = '<span class="badge wait">Could not load offers</span>'; }
}

/* Offer inputs used to be prompt() / confirm() pop-ups. They are now proper
   modals with a fee + total preview — a wallet pop-up should never be the
   first time you see what you're about to spend. */
function confirmModal(msg) {
  return new Promise(resolve => {
    const m = Flow.openModal(
      '<h3>Are you sure?</h3><p>' + esc(msg) + '</p>' +
      '<div style="display:flex;gap:8px;margin-top:14px">' +
      '<button class="btn" id="flow-ok">Yes, do it</button>' +
      '<button class="btn ghost" id="flow-cancel">Cancel</button></div>');
    m.querySelector('#flow-ok').onclick = () => { Flow.closeModal(); resolve(true); };
    m.querySelector('#flow-cancel').onclick = () => { Flow.closeModal(); resolve(false); };
  });
}
function askEthModal(title, label, def) {
  return new Promise((resolve, reject) => {
    const m = Flow.openModal(
      '<h3>' + esc(title) + '</h3>' +
      '<div class="field"><label>' + esc(label) + '</label>' +
      '<input id="flow-eth" type="number" step="0.01" min="0" value="' + esc(def || '') + '"></div>' +
      '<p class="note" id="flow-eth-total"></p>' +
      '<div style="display:flex;gap:8px;margin-top:14px">' +
      '<button class="btn" id="flow-ok">Continue</button>' +
      '<button class="btn ghost" id="flow-cancel">Cancel</button></div>');
    const input = m.querySelector('#flow-eth');
    const total = m.querySelector('#flow-eth-total');
    const update = () => {
      const v = Number(input.value);
      total.textContent = (isFinite(v) && v > 0)
        ? 'Total locked: ' + v + ' ETH. If accepted, the producer is paid the agreed price and any remainder is refunded — no platform fee is taken.'
        : 'Enter an amount in ETH.';
    };
    input.oninput = update; update();
    input.focus();
    m.querySelector('#flow-ok').onclick = () => {
      const v = input.value;
      const n = Number(v);
      if (!isFinite(n) || n <= 0) { update(); return; }
      Flow.closeModal(); resolve(v);
    };
    m.querySelector('#flow-cancel').onclick = () => { Flow.closeModal(); reject({ cancelled: true }); };
  });
}
function askEth(msg, def) {
  // Kept as the single entry point: title is the question, label is ETH.
  return askEthModal('Make an offer', msg, def);
}

async function offerAction(act, offerId, btn) {
  const o = currentOffers.find(x => x.offerId === String(offerId));
  if (!o) return;
  const done = async (fn) => {
    const label = btn.textContent;
    try {
      btn.disabled = true;
      btn.textContent = 'Confirm in wallet\u2026';
      await fn();
      await loadOffers();
    } catch (e) {
      if (!e || !e.cancelled) alert(e.message || e);
      btn.disabled = false;
      btn.textContent = label;
    }
  };
  try {
    switch (act) {
      case 'raise': {
        const v = await askEth('Raise your bid by how much (ETH)?');
        await done(() => api.offerTx('raiseOffer', [offerId], ethers.parseEther(v)));
        break;
      }
      case 'lower': {
        const v = await askEth(`Lower your bid to how much (ETH)? Current: ${o.bidEth}`);
        await done(() => api.offerTx('lowerOffer', [offerId, ethers.parseEther(v)]));
        break;
      }
      case 'final':
        if (!(await confirmModal('Make this FINAL? Take-it-or-leave-it, 24-hour fuse.'))) break;
        await done(() => api.offerTx('markBidFinal', [offerId]));
        break;
      case 'acceptAsk': {
        const top = ethers.parseEther(o.askEth) - ethers.parseEther(o.bidEth);
        await done(() => api.offerTx('acceptAsk', [offerId], top > 0n ? top : undefined));
        break;
      }
      case 'cancel':
        if (!(await confirmModal('Cancel your offer? Your ETH is refunded.'))) break;
        await done(() => api.offerTx('cancelOffer', [offerId]));
        break;
      case 'accept':
        if (!(await confirmModal(`Accept ${o.bidEth} ETH for ${o.exclusive ? 'the 1-of-1 exclusive' : o.amount + ' leases'}?`))) break;
        await done(() => api.offerTx('acceptOffer', [offerId]));
        break;
      case 'counter': {
        const v = await askEth(`Your counter-ask (ETH)? Their bid: ${o.bidEth}`);
        await done(() => api.offerTx('counterOffer', [offerId, ethers.parseEther(v)]));
        break;
      }
      case 'counterFinal': {
        const v = await askEth(`Your FINAL ask (ETH)? 24-hour fuse. Their bid: ${o.bidEth}`);
        await done(() => api.offerTx('counterFinal', [offerId, ethers.parseEther(v)]));
        break;
      }
      case 'withdrawAsk':
        await done(() => api.offerTx('withdrawAsk', [offerId]));
        break;
      case 'reject':
        if (!(await confirmModal('Reject this offer? Their ETH is refunded.'))) break;
        await done(() => api.offerTx('rejectOffer', [offerId]));
        break;
    }
  } catch (e) { if (!e || !e.cancelled) alert(e.message || e); }
}

async function submitOffer() {
  try {
    if (!window.VBEATS_NFT_ADDRESS) throw new Error('NFT contract is not deployed yet');
    const exclusive = document.getElementById('off-exclusive').checked;
    const amount = exclusive ? 1 : Math.max(1, parseInt(document.getElementById('off-amount').value) || 1);
    const eth = document.getElementById('off-eth').value;
    const days = Math.min(90, Math.max(1, parseInt(document.getElementById('off-days').value) || 7));
    const final = document.getElementById('off-final').checked;
    if (!eth || !isFinite(Number(eth)) || Number(eth) <= 0) throw new Error('Enter an offer amount in ETH');
    if (!currentBeat || !currentBeat.fingerprint) throw new Error('Beat not loaded yet');
    const fp = api.fpHex(currentBeat.fingerprint);
    const value = ethers.parseEther(eth);
    const signer = await api.getSigner();
    const c = api.offersContract(signer);
    const tx = final
      ? await c.makeFinalOffer(window.VBEATS_NFT_ADDRESS, fp, exclusive, amount, { value })
      : await c.makeOffer(window.VBEATS_NFT_ADDRESS, fp, exclusive, amount, days * 86400, { value });
    await tx.wait();
    document.getElementById('off-eth').value = '';
    await loadOffers();
  } catch (e) { alert(e.message || e); }
}

loadOffers();
loadNft();
load();
</script>
