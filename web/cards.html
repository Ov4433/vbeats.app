<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Cards — Verified Beats Studio</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav" id="nav"></nav>

<main class="wrap">
  <div style="padding:26px 0 6px">
    <h1 style="font-size:30px;margin-bottom:6px">Beat Cards</h1>
    <p class="note">Every card is a beat with its receipt on Base — tap one for its card back, lease, and offers.</p>
  </div>
  <div class="cards-grid" id="cards" style="padding:18px 0 50px">
    <p class="note">Loading cards…</p>
  </div>
</main>

<footer class="footer"><div class="footer-bat"><img src="assets/mascot-profile.webp" alt=""></div>Verified Beats Studio — Volt keeps the receipts.</footer>

<script src="js/api.js"></script>
<script src="js/flow.js"></script>
<script src="js/volt.js"></script>
<script>
nav('cards.html');
document.getElementById('cards').innerHTML = Flow.skeletonHtml(6);
Flow.fetchWithRetry(() => api.marketplace({ limit: 24 }), 3).then(d => {
  const beats = d.beats || [];
  document.getElementById('cards').innerHTML = beats.length
    ? beats.map(card).join('')
    : `<div style="grid-column:1/-1;text-align:center;padding:24px">
        <img src="assets/mascot-profile.webp" alt="" style="width:110px;border-radius:50%;margin-bottom:10px">
        <p class="note">No cards yet — the first beat dropped becomes card #1.</p>
        <p style="margin-top:14px"><a class="btn" href="studio.html">Drop the first beat</a></p></div>`;
  Flow.refreshUsd(document.getElementById('cards'));
  Flow.wireCardMenus(document.getElementById('cards'));
  Flow.verifyCards(document.getElementById('cards')); // lazy on-chain proof as cards scroll into view
}).catch(() => {
  document.getElementById('cards').innerHTML = Flow.coldStartHtml();
});

/* Delegated play / vote for the NFT cards (mirrors index.html). */
document.getElementById('cards').addEventListener('click', e => {
  const playBtn = e.target.closest('[data-play-id]');
  if (playBtn) {
    Flow.play(playBtn.getAttribute('data-play-url'), playBtn.getAttribute('data-play-title'), playBtn);
    return;
  }
  const voteBtn = e.target.closest('[data-vote-id]');
  if (voteBtn) {
    if (!api.loggedIn()) { Flow.signInModal('vote'); return; }
    voteBtn.disabled = true;
    api.vote(voteBtn.getAttribute('data-vote-id')).then(r => {
      const count = voteBtn.querySelector('.vote-count');
      if (count) count.textContent = r.totalWeight;
      voteBtn.classList.toggle('voted', !!r.voted);
    }).catch(err => alert(err.message || err))
      .finally(() => { voteBtn.disabled = false; });
  }
});

function card(b) {
  // Same data as everywhere else: ETH price, honest badge (fingerprint,
  // not a hardcoded on-chain claim), play + Buy + vote, rest behind the
  // "…" menu — matching Flow.beatCard on home/marketplace/creator.
  const votes = (b.votes && b.votes.totalWeight) || 0;
  return `<div class="nft-card" data-beat-id="${esc(b.id)}">
    <img src="${esc(api.artUrl(b))}" alt="" loading="lazy" onclick="location.href='beat.html?id=${esc(b.id)}'">
    <div class="nc-body">
      <div class="nc-title">${esc(b.title)}</div>
      <div class="nc-meta">${esc(b.genre)}${b.bpm ? ' · ' + esc(b.bpm) + ' BPM' : ''}${b.duration || b.dur ? ' · ' + fmtDur(b.duration || b.dur) : ''}</div>
      <div class="nc-row"><span data-price-eth="${esc(Number(b.price) || 0)}">${Flow.priceHtml(b)}</span>${Flow.verifyChip(b)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center">
        <button class="play-btn" data-play-id="${esc(b.id)}" data-play-url="${esc(api.mediaUrl(b))}" data-play-title="${esc(b.title)}" aria-label="Play preview">&#9654;</button>
        <a class="btn small" href="beat.html?id=${esc(b.id)}">Buy license</a>
        <button class="btn small ghost vote-btn${b.votedByMe ? ' voted' : ''}" data-vote-id="${esc(b.id)}" aria-label="Vote for this beat">&Delta; <span class="vote-count">${esc(votes)}</span></button>
        <button class="btn small ghost card-menu-btn" data-menu-id="${esc(b.id)}" aria-label="More actions">&hellip;</button>
      </div>
      <div class="card-menu" id="menu-${esc(b.id)}" style="display:none">
        <a href="creator.html?u=${esc(b.userId)}">Producer</a>
        <a href="studio.html">Remix</a>
        <a href="beat.html?id=${esc(b.id)}">View on-chain receipt</a>
      </div>
    </div></div>`;
}
</script>
</body>
</html>
